workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 60
    integrations:
      # App Manager 権限を持つ既存の App Store Connect キーを流用する。
      # 名前は Codemagic 上の登録名で、実体はこの Apple Team のキー。
      app_store_connect: MusicDNA ASC
    environment:
      # テストは lib/*.ts を直接 import する（node --test の型ストリッピング頼み）。
      # これが既定で有効なのは Node 23.6 以降なので、ビルドマシンの既定任せにすると
      # 検証ステップが環境次第で落ちる。開発機と同じ系列に固定する。
      node: 24
      groups:
        # APPLE_CERT_PRIVATE_KEY を保持する。署名証明書の作成・保存に必要。
        # 名前が重複しているのは Codemagic 側の登録時の入力ミス由来。実体に合わせている。
        - fin_apple_credentialsfin_apple_credentials
      vars:
        BUNDLE_ID: app.fin
        MARKETING_VERSION: "1.1"
        XCODE_PROJECT: ios/App/App.xcodeproj
        # Capacitor は CocoaPods を使うため、ビルドは workspace 側で行う。
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: npm ci --ignore-scripts
      - name: Verify the web app before building anything native
        # このワークフローは web を placeholder ディレクトリで済ませるため、
        # 型エラーやテスト失敗があっても署名済み IPA が出て App Store Connect に載る。
        # 壊れたコードがバイナリになる前に、ここで止める。依存はすでに入っている。
        script: |
          set -e
          npm run typecheck
          npm test
      - name: Create capacitor-www placeholder
        script: mkdir -p capacitor-www
      - name: Add or sync iOS platform
        script: |
          if [ -e "$XCODE_PROJECT" ]; then
            npx cap sync ios
          else
            npx cap add ios
          fi
      - name: Raise minimum iOS version to 15.0
        # ITMS-90068 対応（2026-08-05 build 8 で Apple 警告）: Capacitor 生成時の既定 14.0 の
        # ままだと Spring 2027 以降アップロード不可になる。ios/ は毎ビルド生成のためここで書き換える。
        # ぐるりタイマー（打席2号）で先に恒久対応した内容をそのまま移植。
        script: |
          set -e
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          grep -m1 "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 "platform :ios" ios/App/Podfile
      - name: Install the app icon into the generated iOS project
        # ios/ は毎ビルド生成し直されるため、放置すると Capacitor のプレースホルダー
        # アイコンのまま提出されてしまう。生成された AppIcon セットの各スロットを、
        # 元画像から実サイズにリサイズして置き換える。
        #
        # 元画像 public/app-icon-1024.png は 1024x1024・アルファなし・端まで不透明。
        # Apple はアルファ付きのアイコンをリジェクトし、透明部分は白く抜けて見えるため、
        # sips の出力にアルファが混入していないこともここで検査する。
        script: |
          set -e
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          SOURCE="public/app-icon-1024.png"

          test -f "$SOURCE" || { echo "app icon source is missing: $SOURCE"; exit 1; }
          test -d "$ICONSET" || { echo "generated icon set is missing: $ICONSET"; exit 1; }

          slots=$(find "$ICONSET" -name '*.png')
          test -n "$slots" || { echo "no icon slots found in $ICONSET"; exit 1; }

          for slot in $slots; do
            width=$(sips -g pixelWidth "$slot" | awk '/pixelWidth/{print $2}')
            height=$(sips -g pixelHeight "$slot" | awk '/pixelHeight/{print $2}')
            sips -s format png --resampleHeightWidth "$height" "$width" "$SOURCE" --out "$slot"
            echo "installed ${width}x${height} -> $slot"
          done

          for slot in $slots; do
            if sips -g hasAlpha "$slot" | grep -q 'hasAlpha: yes'; then
              echo "icon slot kept an alpha channel, which App Review rejects: $slot"
              exit 1
            fi
          done
      - name: Declare export compliance in Info.plist
        # Fin は HTTPS 以外の暗号化を使わないため、輸出コンプライアンスの免除に該当する。
        # ios/ は CI 上で生成されるので、毎ビルド後にここで書き込む。
        # これがないと App Store Connect が毎回「コンプライアンスがありません」と表示する。
        script: |
          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            ios/App/App/Info.plist \
            || /usr/libexec/PlistBuddy \
              -c "Set :ITSAppUsesNonExemptEncryption false" \
              ios/App/App/Info.plist
      - name: Declare the notifications purpose string in Info.plist
        # iOS 26 の実機で UNUserNotificationCenter 系の呼び出しが一切返らない症状の対策。
        # 通知の利用目的文字列が無いことが原因の可能性があるため、輸出コンプライアンスと
        # 同じ方法で毎ビルド書き込む。害はなく、あって困ることのないキー。
        script: |
          PURPOSE="実行中のタスクの見積もり時刻をお知らせするために通知を使います。"
          /usr/libexec/PlistBuddy \
            -c "Add :NSUserNotificationsUsageDescription string $PURPOSE" \
            ios/App/App/Info.plist \
            || /usr/libexec/PlistBuddy \
              -c "Set :NSUserNotificationsUsageDescription $PURPOSE" \
              ios/App/App/Info.plist
      - name: Set a build number above the last uploaded one
        # ios/ は毎ビルド生成し直され、Capacitor の既定は常に 1 になる。
        # App Store Connect は同じビルド番号のアップロードを拒否するため、
        # 2 回目以降はここで番号を上げないと publishing 段階で必ず失敗する。
        # Codemagic の $BUILD_NUMBER はアプリごとに単調増加するので、それを使う。
        script: |
          set -e
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
          agvtool what-version
      - name: Set the marketing version to match the ASC version
        # ios/ は毎ビルド生成し直されるため CFBundleShortVersionString が Capacitor の
        # 既定（1.0）に戻る。ASC の 1.1 に添付するには、ここで一致させる必要がある。
        # 設定して終わりにせず、一致を検証してから先へ進む。
        script: |
          set -e
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          test "$(agvtool what-marketing-version -terse1)" = "$MARKETING_VERSION"             || { echo "marketing version が $MARKETING_VERSION になっていない"; exit 1; }
      - name: Install CocoaPods dependencies
        # npm ci は --ignore-scripts のため pod install が走らない。ここで明示的に入れる。
        script: |
          cd ios/App
          pod install
      - name: Fetch or create signing files
        # app.fin のプロビジョニングプロファイルはまだ存在しないため --create で新規作成する。
        # 認証情報は上の app_store_connect 統合から自動的に環境へ渡る。
        script: |
          set -e
          # 署名秘密鍵を平文でディスクに置く。既定パーミッションのまま残すと
          # 以降のステップ（pod install 等、任意のスクリプトが走る）から読める。
          umask 077
          trap 'rm -f /tmp/cert_key.pem' EXIT
          keychain initialize
          printf '%s' "$APPLE_CERT_PRIVATE_KEY" > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:/tmp/cert_key.pem" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # IPA は App Store Connect にアップロードするが、TestFlight 配布・審査提出はオーナーが手動で行う。
        submit_to_testflight: false
        submit_to_app_store: false
